<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Canvas</title>
    <meta name="description" content="Excalidraw scenes, shared live and encrypted. Free, with a native Mac app." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <script>
      window.EXCALIDRAW_ASSET_PATH = "/";
      try {
        var t = localStorage.getItem("canvas-theme");
        var dark = t === "dark" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; overflow: hidden; }
      body { background: #fff; }
      html.dark body { background: #121212; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
